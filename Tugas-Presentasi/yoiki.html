<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pebble Liquid Glass Login</title>
    <!-- Hubungkan FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Hubungkan file CSS eksternal -->
    <link rel="stylesheet" href="yoiki.css">
</head>
<body>

    <div class="login-card">
        <h2>Login</h2>
        <p>Sign in to your account</p>

        <form action="#" method="POST">
            <div class="input-box">
                <span class="icon-left"><i class="fa-regular fa-user"></i></span>
                <input type="text" placeholder="Username" required>
            </div>

            <div class="input-box">
                <span class="icon-left"><i class="fa-solid fa-lock"></i></span>
                <input type="password" id="passwordField" placeholder="Password" required>
                <button type="button" class="toggle-password" onclick="togglePass()">
                <i class="fa-solid fa-eye-slash" id="eyeIcon"></i></button>
            </div>

            <div class="options">
                <label class="remember">
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                    Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn-signin">SIGN IN</button>
        </form>
        </div>
    </div>

    <script>
        function togglePass() {
            const pass = document.getElementById('passwordField');
            const eyeIcon = document.getElementById('eyeIcon');
            if (pass.type === 'password') {
                pass.type = 'text';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            } else {
                pass.type = 'password';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            }
        }
    </script>

</body>
</html>
