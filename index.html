<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makanan Favorit Kelompok 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <p class="eyebrow">Kelompok 2</p>
      <h1>Daftar Makanan Favorit</h1>
      <p class="intro">Lima makanan pilihan yang paling kami sukai.</p>
    </header>

    <ul class="food-list">
      <li class="food-card">
        <img src="https://www.kompas.com/food/read/2021/02/22/130200475/resep-tahu-tek-surabaya-wajib-ada-petis-pada-bumbu-kacangnya&amp;fit=crop&amp;w=900&amp;q=85" alt="Hidangan dengan sayuran dan saus sebagai ilustrasi tahu tek" loading="lazy">
        <div class="food-info">
          <span class="person">Abi</span>
          <h2>Tahu tek</h2>
        </div>
      </li>
      <li class="food-card">
        <img src="https://www.kompas.com/food/read/2021/02/22/130200475/resep-ayam-goreng-renyah&amp;fit=crop&amp;w=900&amp;q=85" alt="Ayam goreng renyah" loading="lazy">
        <div class="food-info">
          <span class="person">Arya</span>
          <h2>Ayam goreng</h2>
        </div>
      </li>
      <li class="food-card">
        <img src="https://www.kompas.com/food/read/2021/02/22/130200475/resep-bebek-goreng&amp;fit=crop&amp;w=900&amp;q=85" alt="Hidangan bebek goreng" loading="lazy">
        <div class="food-info">
          <span class="person">Vino</span>
          <h2>Bebek goreng</h2>
        </div>
      </li>
      <li class="food-card">
        <img src="https://www.kompas.com/food/read/2021/02/22/130200475/resep-bubur-ayam&amp;fit=crop&amp;w=900&amp;q=85" alt="Semangkuk makanan hangat sebagai ilustrasi bubur ayam" loading="lazy">
        <div class="food-info">
          <span class="person">Orlando</span>
          <h2>Bubur ayam</h2>
        </div>
      </li>
      <li class="food-card">
        <img src="https://www.kompas.com/food/read/2021/02/22/130200475/resep-mi-ayam&amp;fit=crop&amp;w=900&amp;q=85" alt="Semangkuk mi dengan sayuran" loading="lazy">
        <div class="food-info">
          <span class="person">Rifat</span>
          <h2>Mi ayam</h2>
        </div>
      </li>
    </ul>
  </main>
</body>
</html>
