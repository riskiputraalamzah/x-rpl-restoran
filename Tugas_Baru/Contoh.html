<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Project RPL</title>
    <!-- CSS Bootstrap -->
    <link href="" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow p-4 mx-auto" style="max-width: 400px;">
            <h3 class="text-center mb-3">Aplikasi Sapa Siswa</h3>

            <div class="container mt-5">
                <label for="namaInput" class="form-label">Masukkan Nama Kmau: </label>
                <input type="text" class="form-control" id="namaInput" placeholder="Contoh: Rashya">
            </div>

            <button class="btn btn-success w-100" oneclick="tampilkanPesan()">Sapa Sekarang</button>
            

            <div id="hasilPesan" class="mt-3 text-center fw-bold text-primary"></div>
        </div>
    </div>

    <!-- Script JavaScript (wajib ada di dalam body sebelum tag penutup html) -->
    <script>
        function tanpilkanPesan() {
            let nama = document.getElementById("namaInput").value;

            if(nama === ""){
                alert("Nama tidak boleh kosong!");
            } else {
                dokumnet.getElementById("hasilPesan").innerHTML = "Halo, " + nama + "! Semangat belajar pemrograman"
            }
        }
    </script>

    <!-- JS Bootstrap -->
    <script src ="https://cdn.jsdelivr.net/npm/bootstrap@S.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
